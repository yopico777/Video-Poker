<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#087d39"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Video Poker"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Video Poker - Jacks or Better</title><link rel="stylesheet" href="style1.css"><link rel="stylesheet" href="style2.css"></head><body><main class="game"><div class="brand">DRAW POKER</div><div class="sub">JACKS OR BETTER</div><table class="paytable"><thead><tr><th>WINNING HAND</th><th data-head-b="1">1 BET</th><th data-head-b="2">2 BET</th><th data-head-b="3">3 BET</th><th data-head-b="4">4 BET</th><th data-head-b="5">5 BET</th></tr></thead><tbody id="paybody"></tbody></table><section class="cards" id="cards"></section><section class="top"><div class="meter">CREDITS<b id="credits">1000</b></div><div class="message" id="message">GAME OVER</div><div class="meter">WAGER<b id="bet">1</b></div></section><div class="copyright">©2026 YOSHiYUKi</div><section class="controls"><button id="betBtn"><span>BET ONE</span></button><button id="maxBtn"><span>MAX BET</span></button><button id="dealBtn"><span>DEAL</span></button><button class="double" id="doubleBtn" disabled><span>DOUBLE UP</span></button><button id="soundBtn"><span>SOUND ON</span></button><button id="fullBtn"><span>FULL SCREEN</span></button><button id="resetBtn"><span>RESET</span></button></section><div class="note">FOR AMUSEMENT ONLY</div><div class="settings-overlay" id="settingsOverlay" hidden><div class="settings-panel"><div id="passView"><h2>OWNER ACCESS</h2><input id="passInput" type="password" inputmode="numeric" maxlength="4" placeholder="PASSWORD"><div class="settings-error" id="passError"></div><button id="passEnter">ENTER</button><button class="cancel" id="passCancel">CANCEL</button></div><div id="rateView" hidden><h2>WIN RATE SETTING</h2><input id="rateInput" type="number" min="0" max="100" step="1"><div class="settings-note">0〜100％で設定してください</div><button id="rateSave">SAVE</button><button class="cancel" id="rateCancel">CANCEL</button></div></div></div></main><script src="app.js"></script></body></html>
